services:
  - type: web
    name: telegram-bot-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # Render dashboard mein khud daalo
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false          # Render dashboard mein khud daalo
      - key: DB_PATH
        value: /app/data.db
      - key: PING_EVERY
        value: "600"
    # RENDER_EXTERNAL_URL Render khud set karta hai, main.py usi ko ping karta hai.
    #
    # Chat history permanent rakhni ho to paid plan lo aur ye add karo:
    #   plan: starter
    #   disk:
    #     name: data
    #     mountPath: /data
    #     sizeGB: 1
    # aur DB_PATH ko /data/data.db kar do.
