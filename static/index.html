<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Messages</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8e8e93;--sep:rgba(60,60,67,.18);
  --blue:#007aff;--in:#e9e9eb;--in-text:#000;--fill:rgba(118,118,128,.12);
  --glass:rgba(249,249,249,.78);--red:#ff3b30;--green:#34c759;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1c1c1e;--text:#fff;--sub:#8e8e93;--sep:rgba(84,84,88,.5);
  --blue:#0a84ff;--in:#262629;--in-text:#fff;--fill:rgba(118,118,128,.24);
  --glass:rgba(29,29,31,.78);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--bg);color:var(--text);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}

/* ---------- Sidebar ---------- */
#side{width:380px;flex:none;display:flex;flex-direction:column;background:var(--bg);border-right:.5px solid var(--sep);position:relative}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
#sideTop{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;border-bottom:.5px solid transparent;transition:border-color .2s}
#sideTop.scrolled{border-color:var(--sep)}
.row1{display:flex;justify-content:space-between;align-items:center;height:34px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--fill)}
.iconbtn:active{opacity:.5}
h1{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:4px 0 8px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:0 8px;height:36px;color:var(--sub)}
.search input{flex:1;border:0;background:none;outline:0;color:var(--text);font:inherit;font-size:17px;min-width:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px;position:relative}
.seg button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;position:relative;z-index:1;transition:color .2s}
.seg .pill{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
#list{flex:1;overflow:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px)}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.chat{display:flex;gap:12px;padding:10px 14px;align-items:center;cursor:pointer;position:relative}
.chat:active,.chat.sel{background:var(--fill)}
.chat+.chat::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.avatar{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:19px}
.cbody{flex:1;min-width:0}
.ctop,.cbot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctime{font-size:14px;color:var(--sub);flex:none}
.cprev{font-size:15px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:20px}
.badge{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.tag{font-size:12px;color:var(--red)}
.empty{margin:60px auto;text-align:center;color:var(--sub);max-width:250px;font-size:15px}

/* ---------- Chat pane ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--card);position:relative}
#head{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:.5px solid var(--sep);z-index:3;min-height:56px}
#back{position:absolute;left:6px;display:none;align-items:center;color:var(--blue);padding:8px}
.htitle{text-align:center;max-width:60%}
.htitle b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{font-size:12px;color:var(--sub)}
.hav{width:34px;height:34px;font-size:14px;margin:0 auto 2px}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.day{align-self:center;font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:500}
.m{max-width:75%;padding:8px 13px;border-radius:18px;background:var(--in);color:var(--in-text);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;position:relative;margin-top:6px;cursor:pointer;font-size:16.5px;line-height:1.28}
.m.cont{margin-top:1px}
.m.out{align-self:flex-end;background:var(--blue);color:#fff}
.m.tail::after{content:"";position:absolute;bottom:0;width:16px;height:16px}
.m.in.tail::before{content:"";position:absolute;bottom:0;left:-6px;width:20px;height:18px;background:var(--in);border-bottom-right-radius:16px 14px}
.m.in.tail::after{left:-26px;width:26px;height:18px;background:var(--card);border-bottom-right-radius:10px}
.m.out.tail::before{content:"";position:absolute;bottom:0;right:-6px;width:20px;height:18px;background:var(--blue);border-bottom-left-radius:16px 14px}
.m.out.tail::after{right:-26px;width:26px;height:18px;background:var(--card);border-bottom-left-radius:10px}
.m{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.ricon{position:absolute;right:-42px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;opacity:0;transform:scale(.5);pointer-events:none}
.ricon.hit{background:var(--blue);color:#fff}
.who{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:2px}
.m.picked{outline:2px solid var(--blue);outline-offset:2px}
.nochat{margin:auto;color:var(--sub);text-align:center}

#composer{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);border-top:.5px solid var(--sep);z-index:3}
#replybar{display:none;align-items:center;gap:10px;padding:4px 6px 8px}
#replybar.on{display:flex}
#replybar .bar{width:3px;align-self:stretch;background:var(--blue);border-radius:2px}
#replybar .t{flex:1;min-width:0;font-size:13px;color:var(--sub)}
#replybar .t b{display:block;color:var(--blue);font-size:13px}
#replybar .t span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inrow{display:flex;gap:8px;align-items:flex-end}
.field{flex:1;display:flex;border:.5px solid var(--sep);border-radius:19px;background:var(--bg);padding:0 6px 0 14px;align-items:flex-end}
#txt{scrollbar-width:none;flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:17px;resize:none;max-height:120px;padding:7px 0;line-height:1.25}
#txt::-webkit-scrollbar{display:none}
#send{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;margin:2px 0;transition:opacity .15s,transform .15s}
#send:disabled{opacity:0;transform:scale(.6);pointer-events:none}

/* ---------- Broadcast sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
#scrim.on{opacity:1;pointer-events:auto}
#sheet,#psheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);background:var(--bg);border-radius:14px 14px 0 0;z-index:11;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);transition:transform .38s cubic-bezier(.32,.72,0,1)}
#sheet.on,#psheet.on{transform:translate(-50%,0)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead b{font-size:17px}
.link{color:var(--blue);font-size:17px}
.link:disabled{opacity:.4}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px}
#btxt{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;min-height:110px}
.note{font-size:13px;color:var(--sub);margin:8px 6px 0}
.cta{width:100%;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;margin-top:14px}
.cta.confirm{background:var(--red)}
.cta:disabled{opacity:.4}

/* ---------- Toast ---------- */
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-90px);padding:11px 18px;border-radius:22px;font-size:15px;font-weight:500;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.18);transition:transform .45s cubic-bezier(.32,.72,0,1)}
#toast.on{transform:translate(-50%,0)}

/* ---------- Mobile: push navigation ---------- */
@media (max-width:820px){
  #side{width:100%;border:0}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .38s cubic-bezier(.32,.72,0,1);z-index:5}
  body.open #main{transform:none}
  #back{display:flex}
  .htitle{max-width:55%}
}
@media (min-width:821px){.hav{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mrow{display:flex;align-items:flex-end;gap:6px;align-self:flex-start;max-width:88%}
.mrow .m{max-width:none;align-self:auto}
.mrow .m::before,.mrow .m::after{display:none!important}
.sav{width:28px;height:28px;font-size:11px;flex:none}
#psheet{max-height:92vh;overflow:auto}
.flab{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:4px}
#pName,#pAbout,#pDesc{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;padding:0}
.me{width:34px;height:34px;font-size:14px;padding:0;flex:none}
.m.media{padding:4px}
.m.media .cap{padding:5px 9px 3px;white-space:pre-wrap}
.m.media .who{padding:2px 8px 4px}
.m img.pic{display:block;width:240px;max-width:100%;border-radius:14px;cursor:zoom-in;background:var(--fill);min-height:60px}
.m img.stk{width:140px;background:none;cursor:default}
.m video{display:block;width:240px;max-width:100%;border-radius:14px;background:#000}
.m video.stk{width:140px;background:none}
.m video.note{width:200px;height:200px;border-radius:50%;object-fit:cover}
.m audio{display:block;width:240px;max-width:100%;height:40px}
.m .file{display:flex;align-items:center;gap:10px;padding:6px 10px;color:inherit;text-decoration:none;max-width:250px}
.m .file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#composer{position:relative}
.plus{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--sub);display:grid;place-items:center;flex:none;margin-bottom:1px}
.plus:active{opacity:.5}
#mic{width:30px;height:30px;border-radius:50%;color:var(--sub);display:grid;place-items:center;margin:2px 0}
#send:disabled{display:none}
#field.has #mic{display:none}
#menu{position:absolute;left:10px;bottom:calc(100% + 6px);min-width:210px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.22);overflow:hidden;opacity:0;transform:translateY(8px) scale(.96);transform-origin:bottom left;pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.32,.72,0,1);z-index:6}
#menu.on{opacity:1;transform:none;pointer-events:auto}
#menu button{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:12px 16px;font-size:17px;text-align:left}
#menu button+button{border-top:.5px solid var(--sep)}
#menu button:active{background:var(--fill)}
#menu svg{color:var(--blue)}
#rec{display:none;flex:1;align-items:center;gap:10px;border:.5px solid var(--sep);border-radius:19px;background:var(--bg);padding:3px 4px 3px 14px;min-height:38px}
.inrow.recording #rec{display:flex}
.inrow.recording .field,.inrow.recording .plus{display:none}
#rec .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
#rtime{font-variant-numeric:tabular-nums;font-weight:500}
#rec .rl{flex:1;color:var(--sub);font-size:15px}
#rsend{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:30;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:96%;max-height:92%;border-radius:6px}

/* ===== iOS liquid glass ===== */
:root{--lg:rgba(255,255,255,.32);--lg-strong:rgba(255,255,255,.55);--lg-bd:rgba(255,255,255,.6);
  --lg-sh:0 10px 34px rgba(40,60,140,.18);--lg-hi:inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 2px rgba(255,255,255,.3);
  --glass:var(--lg);--in:rgba(255,255,255,.5);--bgc:#dde5f6}
@media (prefers-color-scheme:dark){:root{--lg:rgba(38,40,54,.42);--lg-strong:rgba(58,60,78,.62);--lg-bd:rgba(255,255,255,.17);
  --lg-sh:0 10px 34px rgba(0,0,0,.55);--lg-hi:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -1px 2px rgba(255,255,255,.05);--in:rgba(255,255,255,.12);--bgc:#07080e}}
body{background:var(--bgc)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(36px);animation:drift 26s ease-in-out infinite alternate;
  background:radial-gradient(38% 34% at 14% 18%,#6f9dff,transparent 70%),radial-gradient(34% 34% at 86% 14%,#ff86c2,transparent 70%),
  radial-gradient(44% 40% at 76% 86%,#6fe0c0,transparent 70%),radial-gradient(38% 38% at 18% 86%,#ffbf72,transparent 70%)}
@media (prefers-color-scheme:dark){body::before{opacity:.55}}
@keyframes drift{to{transform:translate3d(4%,-3%,0) scale(1.1)}}
#side,#main,#msgs,#list{background:transparent}
#side{border-right:1px solid var(--lg-bd)}
.glass,#menu,#toast{background:var(--lg)!important;-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%)}
#sideTop,#head,#composer{border:1px solid var(--lg-bd)!important;box-shadow:var(--lg-sh),var(--lg-hi)}
#sideTop{margin:8px;border-radius:28px}
#head{margin:calc(env(safe-area-inset-top) + 8px) 10px 0;padding:8px 12px;border-radius:28px}
#composer{margin:0 10px calc(env(safe-area-inset-bottom) + 8px);padding:8px;border-radius:30px}
#msgs{padding-top:10px}
.group{background:var(--lg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--lg-bd);box-shadow:var(--lg-sh),var(--lg-hi);border-radius:24px}
.chat:active,.chat.sel{background:var(--lg-strong)}
.search,.seg,.iconbtn,.plus{background:var(--lg-strong);box-shadow:var(--lg-hi)}
.seg .pill{background:var(--lg-strong);border:1px solid var(--lg-bd);box-shadow:var(--lg-hi),0 3px 8px rgba(0,0,0,.1)}
.field,#rec{background:var(--lg-strong);border:1px solid var(--lg-bd);box-shadow:var(--lg-hi)}
.m::before,.m::after{display:none!important}
.m{background:var(--in);border:1px solid var(--lg-bd);box-shadow:var(--lg-hi),0 3px 12px rgba(0,0,0,.08);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
.m.out{background:linear-gradient(150deg,rgba(10,132,255,.9),rgba(70,165,255,.72));border-color:rgba(255,255,255,.4)}
.m.media:has(.stk){background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
#send,#rsend,.cta{box-shadow:var(--lg-hi),0 4px 12px rgba(10,132,255,.35)}
#scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:rgba(0,0,0,.25)}
#sheet,#psheet,#ssheet{background:var(--lg-strong);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--lg-bd);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:var(--lg-sh),var(--lg-hi)}
.card{background:var(--lg);border:1px solid var(--lg-bd);box-shadow:var(--lg-hi);border-radius:18px}
#toast{border:1px solid var(--lg-bd)}
#menu{border:1px solid var(--lg-bd);border-radius:20px;box-shadow:var(--lg-sh),var(--lg-hi)}
/* reply quote */
.quote{border-left:3px solid var(--blue);background:rgba(120,120,128,.16);border-radius:8px;padding:4px 8px;margin:0 0 5px;font-size:13px;line-height:1.25;cursor:pointer;white-space:normal}
.quote b{display:block;font-size:12px;color:var(--blue)}.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.m.out .quote{background:rgba(255,255,255,.22);border-color:#fff}.m.out .quote b{color:#fff}
.m.media .quote{margin:4px 6px 6px}
.m.flash{animation:fl 1.3s}@keyframes fl{30%{outline:2px solid var(--blue);outline-offset:2px}}
/* sticker picker */
#ssheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);z-index:11;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:78vh;display:flex;flex-direction:column}
#ssheet.on{transform:translate(-50%,0)}
.sfind{display:flex;gap:8px;align-items:center;padding:8px 14px!important;margin-top:0!important}
#sIn{flex:1;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;min-width:0}
#sTabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none;flex:none}
#sTabs button{flex:none;padding:6px 12px;border-radius:16px;background:var(--lg);border:1px solid var(--lg-bd);font-size:14px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sTabs button.on{background:var(--blue);color:#fff}
#sGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;overflow-y:auto;min-height:170px;align-content:start}
#sGrid .sk{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:30px;padding:4px}
#sGrid .sk:active{background:var(--fill)}
#sGrid img{width:100%;height:100%;object-fit:contain}
#sInfo{text-align:center;color:var(--sub);font-size:13px;padding:8px}
#tsheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,105%);z-index:11;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);transition:transform .38s cubic-bezier(.32,.72,0,1);background:var(--lg-strong);-webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);border:1px solid var(--lg-bd);border-bottom:0;border-radius:30px 30px 0 0;box-shadow:var(--lg-sh),var(--lg-hi)}
#tsheet.on{transform:translate(-50%,0)}
#tTxt{width:100%;border:0;outline:0;background:none;color:var(--text);font:inherit;resize:none;min-height:80px}
</style>
</head>
<body>

<aside id="side">
  <div id="sideTop" class="glass">
    <div class="row1">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button class="avatar me" id="meBtn" aria-label="Bot profile">B</button>
        <span style="color:var(--sub);font-size:13px" id="stat"></span>
      </div>
      <button class="iconbtn" id="bcBtn" aria-label="Sabko message bhejo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
    <h1>Messages</h1>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" placeholder="Search" autocomplete="off">
    </label>
    <div class="seg" id="seg">
      <div class="pill" id="pill"></div>
      <button data-f="all">All</button><button data-f="dm">DMs</button><button data-f="group">Groups</button>
    </div>
  </div>
  <div id="list"></div>
</aside>

<section id="main">
  <div id="head" class="glass">
    <button id="back" aria-label="Back">
      <svg width="13" height="22" viewBox="0 0 13 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2L2 11l9 9"/></svg>
      <span style="margin-left:4px;font-size:17px">Chats</span>
    </button>

  </div>
  <div id="msgs"><div class="nochat">Left side se koi chat chuno</div></div>
  <div id="composer" class="glass">
    <div id="replybar"><div class="bar"></div><div class="t"><b id="rwho"></b><span id="rtxt"></span></div>
      <button class="iconbtn" id="rx" style="width:26px;height:26px;background:var(--fill);color:var(--sub)"><svg width="12" height="12" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
    <div class="inrow">
      <button class="plus" id="plus" aria-label="Attach"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

        <button id="mic" aria-label="Voice note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
      </div>
      <div id="rec"><span class="dot"></span><span id="rtime">0:00</span><span class="rl">Recording</span>
        <button class="link" id="rcancel" style="color:var(--red);font-size:16px;padding:0 6px">Cancel</button>
        <button id="rsend" aria-label="Send voice note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 12l7-7 7 7"/></svg></button></div>
    </div>
    <div id="menu">
      <button id="mPhoto">Photo or Video<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button>
      <button id="mFile">File<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg></button>
      <button id="mSticker">Sticker<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-8-8h1a7 7 0 007 7z"/><path d="M15 4v3a2 2 0 002 2h3"/><circle cx="9" cy="11" r=".6"/><circle cx="14" cy="14" r=".6"/><path d="M8 15c1 1.4 2.3 2 4 2"/></svg></button>
      <button id="mVoice">Voice note<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
    </div>
    <input type="file" id="fMedia" accept="image/*,video/*" hidden>
    <input type="file" id="fAny" hidden>
  </div>
</section>

  <div style="text-align:center">
    <div class="avatar" id="pav" style="width:84px;height:84px;font-size:32px;margin:0 auto 8px;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:600"></div>
    <button class="link" id="pPick">Change photo</button>

  </div>
  <div class="card"><div class="flab">Name</div><input id="pName" maxlength="64" autocomplete="off"></div>
  <div class="card"><div class="flab"><span>About (profile par dikhta hai)</span><span id="aCnt"></span></div><textarea id="pAbout" maxlength="120" rows="2"></textarea></div>

</div>

</div>

  <div class="grab"></div>
  <div class="shead"><button class="link" id="tClose">Close</button><b>Tag members</b><span style="width:52px"></span></div>
  <div class="card"><textarea id="tTxt" placeholder="Tag ke saath kya likhna hai (jaise: hello)"></textarea></div>
  <div class="note" id="tNote"></div>
  <button class="cta" id="tGo" disabled>Start tagging</button>
  <button class="cta confirm" id="tStop" style="display:none">Stop tagging</button>
</div>
<div id="toast" class="glass"></div>

<script>
const $=id=>document.getElementById(id);
const GRADS=["#ff9f0a,#ff375f","#5ac8fa,#007aff","#30d158,#0a9d58","#bf5af2,#5e5ce6","#ff6482,#ff2d55","#64d2ff,#0a84ff","#ffd60a,#ff9f0a"];
let chats=[],cur=null,filter="all",term="",reply=null,sig="",bTarget="all",armed=false;

async function api(u,o){
  const r=await fetch(u,o);
  if(!r.ok){let d=r.status;try{d=(await r.json()).detail||d}catch(e){}throw new Error(d)}
  return r.json();
}
const isDM=c=>c.type==="private";
const kind=c=>isDM(c)?"Direct message":c.type==="channel"?"Channel":"Group";
const initials=s=>(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const noAv=new Set();
function avatar(el,c,ver){
  const id=c.chat_id;
  el.style.background="linear-gradient(145deg,"+GRADS[Math.abs(id)%GRADS.length]+")";
  el.textContent=initials(c.title);
  if(noAv.has(id)&&!ver)return;
  const im=new Image();im.alt="";im.decoding="async";
  im.onload=()=>el.append(im);      // DP aaye tabhi dikhao, warna initials
  im.onerror=()=>noAv.add(id);
  im.src="/api/avatar/"+id+(ver?"?v="+ver:"");
}
function fmtTime(ts){
  if(!ts)return"";const d=new Date(ts*1000),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const y=new Date(n-864e5);if(d.toDateString()===y.toDateString())return"Yesterday";
  return d.toLocaleDateString([],{day:"numeric",month:"short"});
}
function toast(t,bad){const e=$("toast");e.textContent=t;e.style.color=bad?"var(--red)":"var(--text)";e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600)}

/* ----- segmented control ----- */
function seg(root,pill,attr,val){
  const btns=[...root.querySelectorAll("button")],i=btns.findIndex(b=>b.dataset[attr]===val);
  pill.style.width="calc((100% - 4px)/"+btns.length+")";pill.style.transform="translateX("+(i*100)+"%)";
}

/* ----- chat list ----- */
function renderList(){
  const l=$("list"),f=chats.filter(c=>(filter==="all"||(filter==="dm"?isDM(c):!isDM(c)))&&c.title.toLowerCase().includes(term));
  const un=chats.reduce((a,c)=>a+(c.unread||0),0);
  $("stat").textContent=chats.length?chats.length+" chats"+(un?" · "+un+" unread":""):"";
  document.title=un?"("+un+") Messages":"Messages";
  l.innerHTML="";
  if(!f.length){l.innerHTML='<div class="empty">'+(chats.length?"Koi chat nahi mili.":"Abhi koi chat nahi. Bot ko DM karo ya kisi group mein add karo.")+"</div>";return}
  const g=document.createElement("div");g.className="group";
  f.forEach(c=>{
    const r=document.createElement("div");r.className="chat"+(c.chat_id===cur?" sel":"");
    const a=document.createElement("div");a.className="avatar";avatar(a,c);
    const b=document.createElement("div");b.className="cbody";
    const t=document.createElement("div");t.className="ctop";
    const n=document.createElement("span");n.className="cname";n.textContent=c.title;
    const tm=document.createElement("span");tm.className="ctime";tm.textContent=fmtTime(c.last_ts);
    t.append(n,tm);
    const bt=document.createElement("div");bt.className="cbot";
    const p=document.createElement("span");p.className="cprev";
    p.textContent=c.active?(c.last||kind(c)):"Bot is chat se hat gaya";if(!c.active)p.classList.add("tag");
    bt.append(p);
    if(c.unread){const k=document.createElement("span");k.className="badge";k.textContent=c.unread;bt.append(k)}
    b.append(t,bt);r.append(a,b);r.onclick=()=>openChat(c);g.append(r);
  });
  l.append(g);
}
let csig="";
async function loadChats(){try{const d=await api("/api/chats"),k=JSON.stringify(d);if(k===csig)return;csig=k;chats=d;renderList()}catch(e){}}

/* ----- chat view ----- */
function openChat(c){
  cur=c.chat_id;sig="";reply=null;updReply();
  $("title").textContent=c.title;$("subtitle").textContent=kind(c)+(c.active?"":" · removed");avatar($("hav"),c);
  $("tagBtn").style.display=(c.type==="group"||c.type==="supergroup")?"grid":"none";
  document.body.classList.add("open");
  $("msgs").innerHTML="";loadMsgs(true);renderList();
}
async function loadMsgs(force){
  if(cur===null)return;
  let ms;try{ms=await api("/api/messages/"+cur)}catch(e){return}
  const s=ms.length+":"+(ms.length?ms[ms.length-1].id:0);if(s===sig&&!force)return;sig=s;
  const box=$("msgs"),stick=force||box.scrollHeight-box.scrollTop-box.clientHeight<100;
  const c=chats.find(x=>x.chat_id===cur),group=c&&!isDM(c);
  box.innerHTML="";
  if(!ms.length){box.innerHTML='<div class="nochat">Abhi koi message nahi</div>';return}
  let lastDay="",prev=null;
  ms.forEach((m,i)=>{
    const d=new Date(m.ts*1000),day=d.toDateString();
    if(day!==lastDay){const e=document.createElement("div");e.className="day";
      e.textContent=d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})+" "+d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});box.append(e);lastDay=day;prev=null}
    const nxt=ms[i+1],same=(a,b)=>a&&b&&a.direction===b.direction&&a.sender===b.sender&&new Date(b.ts*1000).toDateString()===day;
    const el=document.createElement("div");
    el.className="m "+(m.direction==="out"?"out":"in")+(same(prev,m)?" cont":"")+(same(m,nxt)?"":" tail");
    if(group&&m.direction==="in"&&!same(prev,m)){const w=document.createElement("span");w.className="who";w.textContent=m.sender;el.append(w)}
    if(m.tg_msg_id)el.dataset.tg=m.tg_msg_id;
    if(m.reply_id){const qb=document.createElement("div");qb.className="quote";qb.innerHTML="<b></b><span></span>";
      qb.firstChild.textContent=m.reply_who||"Reply";qb.lastChild.textContent=m.reply_text||"Message";
      qb.onclick=ev=>{ev.stopPropagation();jumpTo(m.reply_id)};el.append(qb)}
    if(m.media_type){
      el.classList.add("media");el.append(mediaNode(m));
      const cap=/^\[[a-z_]+\]$/.test(m.text||"")?"":m.text;
      if(cap){const c=document.createElement("div");c.className="cap";c.textContent=cap;el.append(c)}
    }else el.append(document.createTextNode(m.text));
    el.title=d.toLocaleString();
    if(m.tg_msg_id)swipeReply(el,m);
    if(group&&m.direction==="in"){
      const row=document.createElement("div");row.className="mrow";
      const av=document.createElement("div");av.className="avatar sav";
      if(!same(m,nxt)&&m.sender_id)avatar(av,{chat_id:m.sender_id,title:m.sender.split(" (@")[0]});else av.style.visibility="hidden";
      row.append(av,el);box.append(row);
    }else box.append(el);
    prev=m;
  });
  if(stick)box.scrollTop=box.scrollHeight;
}
function jumpTo(id){
  const t=document.querySelector('#msgs [data-tg="'+id+'"]');if(!t){toast("Ye message upar purani history mein hai",true);return}
  t.scrollIntoView({behavior:"smooth",block:"center"});t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");
}
function swipeReply(el,m){
  const pick=()=>{reply={id:m.tg_msg_id,who:m.direction==="out"?"Dashboard":m.sender,text:m.text};updReply();$("txt").focus()};
  const ic=document.createElement("span");ic.className="ricon";
  ic.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 016 6v3"/></svg>';
  el.append(ic);
  const TH=60;let sx=0,sy=0,dx=0,on=false,locked=false,hit=false,pt="";
  el.addEventListener("pointerdown",e=>{pt=e.pointerType;if(pt==="mouse")return;sx=e.clientX;sy=e.clientY;dx=0;on=true;locked=false;hit=false;el.style.transition="none"});
  el.addEventListener("pointermove",e=>{
    if(!on)return;const x=e.clientX-sx,y=e.clientY-sy;
    if(!locked){if(Math.abs(y)>10&&Math.abs(y)>Math.abs(x)){on=false;return}if(x<-8)locked=true;else return}
    dx=Math.min(0,x);const pull=Math.min(80,-dx*0.7);
    el.style.transform="translateX("+(-pull)+"px)";
    const p=Math.min(1,-dx/TH);ic.style.opacity=p;ic.style.transform="scale("+(0.5+0.5*p)+")";
    const h=-dx>=TH;if(h!==hit){hit=h;ic.classList.toggle("hit",h);if(h&&navigator.vibrate)navigator.vibrate(12)}
  });
  const end=ok=>{
    if(!locked&&!on)return;on=false;
    el.style.transition="transform .3s cubic-bezier(.32,.72,0,1)";el.style.transform="";
    ic.style.opacity=0;ic.style.transform="scale(.5)";ic.classList.remove("hit");
    if(ok&&-dx>=TH)pick();locked=false;dx=0;
  };
  el.addEventListener("pointerup",()=>end(true));
  el.addEventListener("pointercancel",()=>end(false));
  el.addEventListener("click",e=>{if(pt==="mouse"&&!e.target.closest("video,audio,a,img"))pick()}); // desktop: click se reply
}
function lightbox(src){const l=$("lb");l.querySelector("img").src=src;l.classList.add("on")}
function mediaNode(m){
  const src="/api/media/"+m.id,t=m.media_type,mime=m.mime||"";let n;
  if(mime.includes("tgsticker")){const a=document.createElement("div");a.className="cap";a.textContent="🎭 Animated sticker";return a}
  const fail=el=>{const s=document.createElement("div");s.className="cap";s.style.color="var(--sub)";s.textContent="Preview nahi ho paya";el.replaceWith(s)};
  if(t==="photo"||mime.startsWith("image/")){
    n=new Image();n.className=t==="sticker"?"pic stk":"pic";n.loading="lazy";n.alt="";n.src=src;
    if(t!=="sticker")n.onclick=()=>lightbox(src);n.onerror=()=>fail(n);
  }else if(t==="video"||t==="animation"||t==="video_note"||t==="sticker"){
    n=document.createElement("video");n.playsInline=true;n.src=src;n.onerror=()=>fail(n);
    if(t==="animation"||t==="sticker"){n.autoplay=true;n.loop=true;n.muted=true;if(t==="sticker")n.className="stk"}
    else{n.controls=true;n.preload="none";if(t==="video_note")n.className="note"}
  }else if(t==="voice"||t==="audio"){
    n=document.createElement("audio");n.controls=true;n.preload="none";n.src=src;n.onerror=()=>fail(n);
  }else{
    n=document.createElement("a");n.className="file";n.href=src+"?dl=1";
    n.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>';
    const sp=document.createElement("span");sp.textContent=m.fname||"File";n.append(sp);
  }
  return n;
}
function updReply(){
  $("replybar").classList.toggle("on",!!reply);
  if(reply){$("rwho").textContent="Replying to "+reply.who;$("rtxt").textContent=reply.text}
}
function fit(){const t=$("txt");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,120)+"px";const has=!!t.value.trim();$("send").disabled=!has;$("field").classList.toggle("has",has)}
async function send(){
  const t=$("txt").value.trim();if(!t||cur===null)return;
  $("send").disabled=true;
  try{await api("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:cur,text:t,reply_to:reply?reply.id:null})});
    $("txt").value="";reply=null;updReply();fit();await loadMsgs(true);loadChats()}
  catch(e){toast("Send nahi hua: "+e.message,true);fit()}
}

/* ----- broadcast ----- */
function bCount(){return chats.filter(c=>c.active&&(bTarget==="all"||(bTarget==="dm"?isDM(c):!isDM(c)))).length}
function bUpdate(){
  seg($("bseg"),$("bpill"),"t",bTarget);
  const n=bCount(),has=$("btxt").value.trim().length>0;
  $("bnote").textContent=n+" chat"+(n===1?"":"s")+" ko jayega. Sirf wahi DM milenge jinhone bot ko /start kiya hai.";
  const g=$("bgo");g.disabled=!(has&&n);g.classList.toggle("confirm",armed);
  g.textContent=armed?"Confirm: "+n+" chats ko bhejo":"Send to "+n+" chat"+(n===1?"":"s");
}
function bOpen(){armed=false;$("scrim").classList.add("on");$("sheet").classList.add("on");bUpdate();setTimeout(()=>$("btxt").focus(),350)}
function bClose(){$("scrim").classList.remove("on");$("sheet").classList.remove("on");armed=false;$("btxt").blur()}
async function bSend(){
  if(!armed){armed=true;bUpdate();setTimeout(()=>{armed=false;bUpdate()},4000);return}
  const g=$("bgo");g.disabled=true;g.textContent="Sending...";
  try{const r=await api("/api/broadcast",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:$("btxt").value.trim(),target:bTarget})});
    toast("Sent "+r.sent+(r.failed?" · Failed "+r.failed:""),r.failed&&!r.sent);$("btxt").value="";bClose();loadChats();loadMsgs(true)}
  catch(e){toast("Broadcast fail: "+e.message,true)}
  armed=false;bUpdate();
}

/* ----- typing indicator, attach, voice ----- */
let lastTyp=0;
function typing(action,force){
  if(cur===null)return;const n=Date.now();if(!force&&n-lastTyp<4000)return;lastTyp=n;
  fetch("/api/typing",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:cur,action})}).catch(()=>{});
}
async function sendBlob(blob,o){
  if(cur===null){toast("Pehle chat chuno",true);return}
  const qs=new URLSearchParams({chat_id:cur,kind:o.kind,filename:o.filename||"file",mime:o.mime||blob.type||"",dur:o.dur||0});
  if(o.caption)qs.set("caption",o.caption);if(reply)qs.set("reply_to",reply.id);
  toast("Bhej raha hoon...");
  try{
    await api("/api/send_media?"+qs,{method:"POST",headers:{"Content-Type":"application/octet-stream"},body:blob});
    if(o.caption){$("txt").value="";fit()}
    reply=null;updReply();toast("Bhej diya");await loadMsgs(true);loadChats();
  }catch(e){toast("Nahi gaya: "+e.message,true)}
}
function pickFile(e,asDoc){
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(f.size>50e6){toast("File 50 MB se badi hai",true);return}
  const t=f.type;let kind="document";
  if(!asDoc)kind=t==="image/gif"?"animation":t.startsWith("image/")?"photo":t.startsWith("video/")?"video":t.startsWith("audio/")?"audio":"document";
  sendBlob(f,{kind,filename:f.name,mime:t,caption:$("txt").value.trim()});
}
const fmtDur=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
let rec=null;
async function recStart(){
  if(cur===null){toast("Pehle chat chuno",true);return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast("Is browser mein recording nahi chalti",true);return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Mic ki permission do",true);return}
  const mime=["audio/ogg;codecs=opus","audio/webm;codecs=opus","audio/mp4","audio/webm"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  const mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);
  const r={mr,stream,chunks:[],t0:Date.now(),mime:mr.mimeType||mime||"audio/webm"};
  mr.ondataavailable=e=>{if(e.data.size)r.chunks.push(e.data)};
  mr.start(250);
  $("rtime").textContent="0:00";
  r.timer=setInterval(()=>{$("rtime").textContent=fmtDur((Date.now()-r.t0)/1000)},250);
  typing("record_voice",true);r.act=setInterval(()=>typing("record_voice",true),4000);
  rec=r;document.querySelector(".inrow").classList.add("recording");
}
function recStop(send){
  if(!rec)return;const r=rec;rec=null;clearInterval(r.timer);clearInterval(r.act);
  document.querySelector(".inrow").classList.remove("recording");
  const dur=Math.max(1,Math.round((Date.now()-r.t0)/1000));
  r.mr.onstop=()=>{
    r.stream.getTracks().forEach(t=>t.stop());
    if(!send)return;
    if(Date.now()-r.t0<800){toast("Voice bahut chhoti hai",true);return}
    sendBlob(new Blob(r.chunks,{type:r.mime}),{kind:"voice",filename:"voice",mime:r.mime,dur});
  };
  try{r.mr.stop()}catch(e){r.stream.getTracks().forEach(t=>t.stop())}
}

/* ----- bot profile ----- */
let bot=null,newPhoto=null;
async function loadBot(){try{bot=await api("/api/bot");avatar($("meBtn"),{chat_id:bot.id,title:bot.name})}catch(e){}}
function updCnt(){$("aCnt").textContent=$("pAbout").value.length+"/120";$("dCnt").textContent=$("pDesc").value.length+"/512"}
async function pOpen(){
  $("scrim").classList.add("on");$("psheet").classList.add("on");
  try{bot=await api("/api/bot")}catch(e){toast("Bot info nahi mili: "+e.message,true);pClose();return}
  newPhoto=null;$("pName").value=bot.name||"";$("pAbout").value=bot.about||"";$("pDesc").value=bot.description||"";updCnt();
  avatar($("pav"),{chat_id:bot.id,title:bot.name},Date.now());
}
function pClose(){$("psheet").classList.remove("on");if(!$("sheet").classList.contains("on"))$("scrim").classList.remove("on")}
function closeSheets(){bClose();pClose();sClose();tClose()}
async function pSave(){
  if(!bot)return;const b=$("pSave");b.disabled=true;
  const body={},n=$("pName").value.trim(),a=$("pAbout").value,d=$("pDesc").value;
  if(n&&n!==bot.name)body.name=n;if(a!==(bot.about||""))body.about=a;if(d!==(bot.description||""))body.description=d;
  try{
    if(Object.keys(body).length)await api("/api/bot/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(newPhoto)await api("/api/bot/photo",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:newPhoto});
    toast("Profile update ho gaya");await loadBot();
    if(newPhoto)avatar($("meBtn"),{chat_id:bot.id,title:bot.name},Date.now());
    newPhoto=null;pClose();
  }catch(e){toast("Save nahi hua: "+e.message,true)}
  b.disabled=false;
}
async function pDel(){
  if(!confirm("Bot ki profile photo hata dein?"))return;
  try{await api("/api/bot/photo/remove",{method:"POST"});toast("Photo hat gayi");
    const c={chat_id:bot.id,title:bot.name},v=Date.now();avatar($("meBtn"),c,v);avatar($("pav"),c,v)}
  catch(e){toast("Nahi hata: "+e.message,true)}
}
async function pPhoto(e){
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const bmp=await createImageBitmap(f),sq=Math.min(bmp.width,bmp.height),c=document.createElement("canvas");
    c.width=c.height=640;c.getContext("2d").drawImage(bmp,(bmp.width-sq)/2,(bmp.height-sq)/2,sq,sq,0,0,640,640);
    newPhoto=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
    const pv=$("pav");pv.textContent="";const im=new Image();im.src=URL.createObjectURL(newPhoto);pv.append(im);
  }catch(err){toast("Ye photo padh nahi paya",true)}
}

/* ----- sticker picker ----- */
let sData=null,sTab="recent",sCache={};
function sClose(){$("ssheet").classList.remove("on");if(!$("sheet").classList.contains("on")&&!$("psheet").classList.contains("on"))$("scrim").classList.remove("on")}
async function sOpen(){
  if(cur===null){toast("Pehle chat chuno",true);return}
  $("scrim").classList.add("on");$("ssheet").classList.add("on");await sLoad();
}
async function sLoad(){try{sData=await api("/api/stickers");sRender()}catch(e){toast("Stickers nahi mile: "+e.message,true)}}
function sRender(){
  const t=$("sTabs");t.innerHTML="";
  const mk=(k,label)=>{const b=document.createElement("button");b.textContent=label;if(sTab===k)b.className="on";b.onclick=()=>{sTab=k;sRender()};t.append(b)};
  mk("recent","Recent");sData.packs.forEach(p=>mk(p.name,p.title||p.name));
  const g=$("sGrid");g.innerHTML="";$("sInfo").innerHTML="";
  let list=sTab==="recent"?sData.recent:sCache[sTab];
  if(list===undefined){
    $("sInfo").textContent="Load ho raha hai...";
    api("/api/sticker_set?name="+encodeURIComponent(sTab)).then(d=>{sCache[sTab]=d.stickers;sRender()}).catch(e=>{sCache[sTab]=[];toast(e.message,true);sRender()});
    return;
  }
  if(!list.length)$("sInfo").textContent=sTab==="recent"?"Abhi koi sticker nahi. Upar pack link daalo ya chats mein sticker aane do.":"Is pack mein kuch nahi mila";
  list.forEach(s=>{
    const b=document.createElement("button");b.className="sk";
    const im=new Image();im.alt=s.emoji||"";im.loading="lazy";im.src="/api/tgfile/"+encodeURIComponent(s.preview);
    im.onerror=()=>{im.remove();b.textContent=s.emoji||"🎭"};
    b.append(im);b.onclick=()=>sendSticker(s.file_id);g.append(b);
  });
  if(sTab!=="recent"){
    const r=document.createElement("button");r.className="link";r.style.cssText="grid-column:1/-1;font-size:14px;color:var(--red);padding:8px";r.textContent="Is pack ko hatao";
    r.onclick=async()=>{try{await api("/api/sticker_pack?name="+encodeURIComponent(sTab),{method:"DELETE"});sTab="recent";await sLoad()}catch(e){toast(e.message,true)}};g.append(r);
  }
}
async function sAdd(){
  const v=$("sIn").value.trim();if(!v)return;
  try{const d=await api("/api/sticker_set?name="+encodeURIComponent(v));sCache[d.name]=d.stickers;sTab=d.name;$("sIn").value="";await sLoad()}
  catch(e){toast(e.message,true)}
}
async function sendSticker(fid){
  if(cur===null)return;
  try{await api("/api/send_sticker",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:cur,file_id:fid,reply_to:reply?reply.id:null})});
    reply=null;updReply();sClose();toast("Sticker bhej diya");await loadMsgs(true);loadChats()}
  catch(e){toast("Nahi gaya: "+e.message,true)}
}
$("mSticker").onclick=sOpen;$("sClose").onclick=sClose;$("sGo").onclick=sAdd;
$("sIn").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();sAdd()}};
seg($("seg"),$("pill"),"f",filter);bUpdate();
loadBot();loadChats();setInterval(()=>{loadChats();loadMsgs()},3000);
